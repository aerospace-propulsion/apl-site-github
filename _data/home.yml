  - title: Hypersonic Propulsion
    desc: 램제트·스크램제트, 복합 사이클 추진, 충격파-경계층 상호작용과 다공성 블리드
    image: /assets/img/uploads/2024/09/2-2-1024x656.png
    url: /research/interests/
  - title: Hydrogen Energy
    desc: 회전 데토네이션 엔진, 데토네이션 차단기, DNS·LES 기반 청정 고효율 연소
    image: /assets/img/uploads/2024/08/fig_Tcontour_RSSI-1024x861.png
    url: /research/interests/
  - title: Space Technology
    desc: 위성 공력·추진, 하이퍼골릭 재사용 우주비행체, 우주물체 파편화, 달 착륙 먼지 비산
    image: /assets/img/uploads/2024/09/4-1.png
    url: /research/interests/

