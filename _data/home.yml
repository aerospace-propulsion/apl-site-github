tagline: 극초음속 공기역학과 추진, 수소 에너지·연소, 우주 기술을 실험과 고성능 전산해석으로 연구합니다. 국내 유일의 고엔탈피 충격파 풍동(SHyST)을 운영합니다.

# 홈 화면 연구 분야 카드 4개
